openapi: 3.1.0
info:
  title: auth-service
  version: 1.0.0
  description: |
    auth-service is an identity provider to authenticate and authorize client api
  contact:
    name: Raj, Pushp
    email: pushp277@gmail.com
servers:
  # Added by API Auto Mocking Plugin
  - description: |
      local-system
    url: http://localhost:8003/

paths:
  /api/v1/create:
    post:
      tags:
        - client api
      operationId: createNewUser
      summary: create new user

      requestBody:
        required: true
        description: |
          info regarding create User endpoint
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"

      responses:
        '200':
          description: user created successfully


        '400':
          description: user already exists or any field is missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateNewUserError'


  /api/v1/authorize:
    get:
      tags:
        - client api
      summary: authorize user
      operationId: authorizeUser
      parameters:
        - name: redirect_type
          in: query
          required: true
          schema:
            type: string

        - name: client_id
          in: query
          required: true
          schema:
            type: string
            format: uuid

        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string

        - name: sessionCookie
          in: cookie
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '302':
          description: redirect to base url with code
          headers:
            Location:
              schema:
                type: string
                examples:
                  - "http://localhost:3000/callback?accessCode=134"
        '400':
          description: authoriztion failed for this client
          headers:
            Location:
              schema:
                type: string
                examples:
                  - "http://localhost:3000/callback?accessCode=null"

  /api/v1/token:
    post:
      tags:
        - client api
      summary: exchange access_code
      operationId: exchangeToken
      description: exhange access_code for accessToken and refreshToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"

      responses:
        '200':
          description: exchange token response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTokenResponse"

        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTokenBadRequest"

  /api/v1/refresh:
    post:
      summary: generate accessToken and refreshToken
      operationId: generateRefreshToken
      tags:
        - client api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'

      responses:
        "200":

          description: response to get value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'

  /api/v1/login:
    post:
      tags:
        - client api
      summary: allow user to login to the system
      operationId: loginUser
      description: client login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'

      responses:
        '200':
          description: login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'


        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginValidationError'


  /api/v1/logout:
    delete:
      summary: revoke user refresh token and session
      tags:
        - client api
      operationId: logoutUser
      description: client logout
      parameters:
        - name: sessionCookie
          in: cookie
          required: true
          schema:
            type: string
            examples:
              - JSESSIONID_123

      responses:
        '204':
          description: Logout user by expiring session and refreshToken


  /api/oauth2/github/callback:
    get:
      summary: callback with code and state
      tags:
        - "outh2 callback"
      operationId: githubCallback
      description: callback send by github id provider
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
            example: ABC123
        - name: state
          in: query
          required: true
          schema:
            type: string
            example: xyz

      responses:
        '302':
          description: found response send by github oauth2

        '400':
          description: Validation Error

  /api/oauth2/google/callback:
    get:
      summary: callback with code and state
      tags:
        - "outh2 callback"
      operationId: googleCallback
      description: callback send by google id provider
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
            example: ABC123
        - name: state
          in: query
          required: true
          schema:
            type: string
            example: xyz

      responses:
        '302':
          description: found response send by google oauth2

        '400':
          description: Vaidation Error


components:
  schemas:
    User:
      type: object
      required:
        - username
        - firstName
        - lastName
        - password
      properties:
        username:
          type: string
          examples:
            - pushp.raj
          minLength: 3
          maxLength: 50
        firstName:
          type: string
          minLength: 1
          maxLength: 50
          examples:
            - Pushp
        lastName:
          type: string
          examples:
            - Raj
          minLength: 1
          maxLength: 50
        dateOfBirth:
          type: string
          format: date
          examples:
            - 1999-11-08
        password:
          type: string
          format: password
          minLength: 3
          examples:
            - "Strong!P@ssword"
        contactDetails:
          allOf:
            - $ref: '#/components/schemas/ContactDetails'
    ContactDetails:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          examples:
            - pushp.raj@email.com
        phoneNumber:
          type: string
          examples:
            - 08043325354
          pattern: "^\\d{10,11}$"
        address:
          allOf:
            - $ref: '#/components/schemas/Address'

    Address:
      type: object
      properties:
        line1:
          type: string
          examples:
            - 1-29
        line2:
          type: string
          examples:
            - 2-401
        city:
          type: string
          examples:
            - Yokohama
        prefecture:
          type: string
          examples:
            - Kanagawa
        postalCode:
          type: integer
          format: int32
          examples:
            - 2260019

    CreateNewUserError:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          examples:
            - BAD_REQUEST


    CreateTokenRequest:
      type: object
      properties:
        accessCode:
          type: string
          examples:
            - abc123

    CreateTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          examples:
            - abc1234
        refreshToken:
          type: string
          examples:
            - abc2345

    CreateTokenBadRequest:
      type: object
      properties:
        code:
          type: string
          examples:
            - BAD_REQUEST

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          examples:
            - abc123

    RefreshTokenResponse:
      type: object
      required:
        - refreshToken
        - accessToken
      properties:
        refreshToken:
          type: string
        accessToken:
          type: string

    LogoutRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string

    LoginRequest:
      type: object
      properties:
        username:
          type: string
          examples:
            - pushp.raj
        password:
          type: string
          format: password
          examples:
            - Strong!P@ssword

    LoginResponse:
      type: object
      properties:
        accessCode:
          type: string
          examples:
            - abcd123==

    LoginValidationError:
      type: object
      properties:
        message:
          type: string
          examples:
            - user doesn't exist

